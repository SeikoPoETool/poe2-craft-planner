# Ready-to-run packages for people who do not use git: on every push to main, build the app for Windows, macOS
# (Apple Silicon) and Linux, check each package end to end (tools/smoke_test.py), and publish them as the
# "Latest build" release: https://github.com/<owner>/<repo>/releases/latest
name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build LuaJIT
        shell: cmd
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "%RUNNER_TEMP%\LuaJIT" || exit /b 1
          cd /d "%RUNNER_TEMP%\LuaJIT\src" || exit /b 1
          call msvcbuild.bat || exit /b 1
          copy /y luajit.exe "%GITHUB_WORKSPACE%\engine\" || exit /b 1
          copy /y lua51.dll "%GITHUB_WORKSPACE%\engine\" || exit /b 1
          if not exist "%GITHUB_WORKSPACE%\engine\clib" mkdir "%GITHUB_WORKSPACE%\engine\clib"
          copy /y "%GITHUB_WORKSPACE%\engine\pob2\runtime\lua-utf8.dll" "%GITHUB_WORKSPACE%\engine\clib\" || exit /b 1
      - name: Bundled Python
        shell: pwsh
        run: |
          $v = "3.12.10"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile "$env:RUNNER_TEMP\py.zip"
          Expand-Archive "$env:RUNNER_TEMP\py.zip" -DestinationPath "$env:RUNNER_TEMP\python"
          # the app folder (one level up from python\) on the import path: server.py imports craft.py and gamedata.py
          Add-Content "$env:RUNNER_TEMP\python\python312._pth" ".."
      - name: Package
        run: python tools/package.py poe2-craft-planner-windows --python "${{ runner.temp }}\python"
      - name: Smoke test
        run: python tools/smoke_test.py dist/poe2-craft-planner-windows dist/poe2-craft-planner-windows/python/python.exe
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DSrc=..\dist\poe2-craft-planner-windows" "/DVer=1.0.${{ github.run_number }}" tools\installer.iss
          if ($LASTEXITCODE -ne 0) { echo "::error::installer build failed"; exit 1 }
      - name: Install and check the installed copy
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\installed"
          Start-Process -Wait -FilePath dist\poe2-craft-planner-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`""
          if (-not (Test-Path "$dir\start.bat")) { echo "::error::the installer did not install the app"; exit 1 }
          python tools/smoke_test.py "$dir" "$dir\python\python.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
          if (Test-Path "$dir\server.py") { echo "::error::the uninstaller left the app"; exit 1 }
          echo "::notice::installer ok: installs, runs, uninstalls"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/poe2-craft-planner-windows.zip
            dist/poe2-craft-planner-setup.exe

  macos:
    runs-on: macos-latest
    # GitHub's macOS arm64 machines are sometimes not available at all: the other packages are published anyway
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build LuaJIT
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: ./install.sh
      - name: Package
        run: python3 tools/package.py poe2-craft-planner-macos
      - name: Smoke test
        run: python3 tools/smoke_test.py dist/poe2-craft-planner-macos
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/poe2-craft-planner-macos.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build LuaJIT
        run: ./install.sh
      - name: Package
        run: python3 tools/package.py poe2-craft-planner-linux
      - name: Smoke test
        run: python3 tools/smoke_test.py dist/poe2-craft-planner-linux
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/poe2-craft-planner-linux.zip

  release:
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: pkg
          merge-multiple: true
      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build pkg/*.zip pkg/*.exe --target "$GITHUB_SHA" --latest \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "**Windows:** download and run **poe2-craft-planner-setup.exe** (installs without admin rights, adds a Start menu and desktop shortcut). Or the portable zip: unzip, double-click start.bat. **macOS (Apple Silicon):** download the macos zip, unzip, double-click start.command. **Linux:** the linux zip, ./start.command. See the README for details. Built from $GITHUB_SHA."
